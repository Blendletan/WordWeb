<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 80" width="330" height="80" role="img">
<title>RMLP</title>
<desc>RMLP wordmark: a stamp-style badge with a five-node graph motif beside the RMLP wordmark and the tagline "Word puzzles, structurally".</desc>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Libre+Franklin:wght@500&display=swap');
  .rmlp-wordmark { font-family: 'Fraunces', Georgia, serif; font-weight: 700; }
  .rmlp-tagline { font-family: 'Libre Franklin', -apple-system, sans-serif; font-weight: 500; }
</style>
<circle cx="40" cy="40" r="32" fill="none" stroke="#2A2018" stroke-width="1.6"/>
<circle cx="40" cy="40" r="27.3" fill="none" stroke="#2A2018" stroke-width="1"/>
<line x1="40" y1="62.6" x2="28.7" y2="53.2" stroke="#C1432B" stroke-width="1.3"/>
<line x1="40" y1="62.6" x2="51.3" y2="53.2" stroke="#C1432B" stroke-width="1.3"/>
<line x1="28.7" y1="53.2" x2="34.4" y2="45.6" stroke="#C1432B" stroke-width="1.3"/>
<line x1="51.3" y1="53.2" x2="45.6" y2="45.6" stroke="#C1432B" stroke-width="1.3"/>
<line x1="34.4" y1="45.6" x2="45.6" y2="45.6" stroke="#C1432B" stroke-width="1.3"/>
<circle cx="40" cy="62.6" r="2.3" fill="#C1432B"/>
<circle cx="28.7" cy="53.2" r="2.3" fill="#C1432B"/>
<circle cx="51.3" cy="53.2" r="2.3" fill="#C1432B"/>
<circle cx="34.4" cy="45.6" r="2.3" fill="#C1432B"/>
<circle cx="45.6" cy="45.6" r="2.3" fill="#C1432B"/>
<text x="40" y="34" text-anchor="middle" class="rmlp-wordmark" font-size="15" fill="#2A2018">RMLP</text>
<text x="92" y="48" class="rmlp-wordmark" font-size="34" fill="#2A2018">RMLP</text>
<text x="92" y="64" class="rmlp-tagline" font-size="11" letter-spacing="1.5" fill="#6E5D4C">WORD PUZZLES, STRUCTURALLY</text>
</svg>
