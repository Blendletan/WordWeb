<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Word Web — prototype</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root{
    --bg: #0b0f14;
    --bg-elevated: #121820;
    --ink: #e9e4d8;
    --ink-dim: #8b95a1;
    --ink-faint: #5a6572;
    --target: #e3a854;
    --target-glow: rgba(227,168,84,0.45);
    --added: #5fc9ba;
    --added-glow: rgba(95,201,186,0.4);
    --progress: #7fd99a;
    --solution: #b98d52;
    --solution-glow: rgba(185,141,82,0.35);
    --line: #313c47;
    --line-active: #6b7684;
    --danger: #e0785f;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: var(--font-sans);
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; gap: 16px; flex-wrap: wrap;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--bg-elevated), var(--bg));
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 {
    font-size: 17px; margin: 0; font-weight: 600; letter-spacing: 0.02em;
  }
  .brand .tagline { font-size: 12px; color: var(--ink-dim); }

  .targets-strip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .target-chip {
    font-family: var(--font-mono); font-size: 13px; letter-spacing: 0.04em;
    padding: 5px 10px; border-radius: 6px;
    border: 1px solid rgba(227,168,84,0.5);
    color: var(--target); background: rgba(227,168,84,0.08);
  }
  .target-chip.linked { border-color: var(--progress); color: var(--progress); background: rgba(127,217,154,0.1); }

  .controls { display: flex; align-items: center; gap: 10px; }
  .seg {
    display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden;
  }
  .seg button {
    background: transparent; border: none; color: var(--ink-dim);
    font-family: var(--font-sans); font-size: 12px; padding: 6px 11px; cursor: pointer;
  }
  .seg button.active { background: var(--added); color: #06201c; font-weight: 600; }
  .seg button:not(.active):hover { color: var(--ink); background: rgba(255,255,255,0.04); }

  button.ghost {
    background: transparent; border: 1px solid var(--line); color: var(--ink-dim);
    font-family: var(--font-sans); font-size: 12px; padding: 7px 12px; border-radius: 7px;
    cursor: pointer;
  }
  button.ghost:hover { color: var(--ink); border-color: var(--line-active); }

  #stage { position: relative; flex: 1; min-height: 0; }
  #graph-svg { width: 100%; height: 100%; display: block; cursor: grab; }
  #graph-svg:active { cursor: grabbing; }

  .hint-banner {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 12.5px; color: var(--ink-dim); text-align: center;
    pointer-events: none; max-width: 480px; line-height: 1.5;
  }

  #loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; background: var(--bg); z-index: 10;
  }
  #loading .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--added);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading span { font-size: 12.5px; color: var(--ink-dim); }

  footer {
    display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    border-top: 1px solid var(--line); background: var(--bg-elevated);
  }
  #word-input {
    flex: 1; max-width: 260px;
    background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    font-family: var(--font-mono); font-size: 16px; letter-spacing: 0.08em;
    padding: 10px 12px; border-radius: 8px; outline: none;
    text-transform: lowercase;
  }
  #word-input:focus { border-color: var(--added); }
  #word-input.shake { animation: shake 0.32s; border-color: var(--danger); }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
  }
  #submit-btn {
    background: var(--added); color: #06201c; border: none; font-weight: 600;
    font-family: var(--font-sans); font-size: 13px; padding: 10px 16px; border-radius: 8px;
    cursor: pointer;
  }
  #submit-btn:hover { filter: brightness(1.08); }
  #submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #status-msg {
    flex: 1; font-size: 13px; color: var(--ink-dim); min-height: 18px;
  }
  #status-msg.error { color: var(--danger); }
  #status-msg.win { color: var(--progress); font-weight: 600; }

  #counter { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-dim); white-space: nowrap; }

  #win-overlay {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(11,15,20,0.72); backdrop-filter: blur(3px); z-index: 20;
  }
  #win-overlay.show { display: flex; }
  .win-card {
    background: var(--bg-elevated); border: 1px solid var(--line); border-radius: 14px;
    padding: 28px 34px; text-align: center; max-width: 320px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .win-card .score {
    font-family: var(--font-mono); font-size: 40px; font-weight: 700; color: var(--progress);
    margin: 6px 0 2px;
  }
  .win-card .score-label { font-size: 12.5px; color: var(--ink-dim); letter-spacing: 0.04em; text-transform: uppercase; }
  .win-card .detail { font-size: 13px; color: var(--ink-dim); margin: 14px 0 20px; line-height: 1.6; }
  .win-card .detail b { color: var(--ink); }
  .win-card button {
    background: var(--target); color: #2a1a04; border: none; font-weight: 600;
    font-family: var(--font-sans); font-size: 13.5px; padding: 11px 22px; border-radius: 9px;
    cursor: pointer;
  }
  .win-card button:hover { filter: brightness(1.08); }

  svg text.node-label {
    font-family: var(--font-mono); font-size: 13.5px; letter-spacing: 0.03em;
    fill: var(--bg); font-weight: 600; pointer-events: none; user-select: none;
    text-anchor: middle; dominant-baseline: central;
  }

  @media (max-width: 640px) {
    header { padding: 10px 14px; }
    .brand .tagline { display: none; }
    footer { padding: 10px 14px; }
    #word-input { max-width: none; }
    #status-msg { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>Word Web</h1>
      <span class="tagline">connect the gold words — fewest extra words wins</span>
    </div>
    <div class="targets-strip" id="targets-strip"></div>
    <div class="controls">
      <div class="seg" id="k-toggle">
        <button data-k="3" class="active">3 words</button>
        <button data-k="4">4 words (hard)</button>
      </div>
      <button class="ghost" id="new-puzzle-btn">New puzzle</button>
    </div>
  </header>

  <div id="stage">
    <div class="hint-banner">Type a word that's exactly one letter different from a word already in your web.</div>
    <svg id="graph-svg"></svg>
    <div id="loading"><div class="spinner"></div><span>generating puzzle…</span></div>
    <div id="win-overlay">
      <div class="win-card">
        <div class="score-label">your score</div>
        <div class="score" id="win-score">E</div>
        <div class="detail" id="win-detail"></div>
        <button id="play-again-btn">New puzzle</button>
      </div>
    </div>
  </div>

  <footer>
    <input id="word-input" type="text" maxlength="5" placeholder="type a word…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="submit-btn">Add</button>
    <button class="ghost" id="reveal-btn">Reveal answer</button>
    <div id="status-msg"></div>
    <div id="counter">0 words added</div>
  </footer>
</div>

/* =========================================================================
   GRAPH + STEINER TREE SOLVER
   (Exact Dreyfus–Wagner DP, restricted to a local neighborhood for speed —
   verified against known closed-form results for k=2 and k=3.)
   ========================================================================= */
function buildAdjacency(words) {
  const adj = new Map();
  for (const w of words) adj.set(w, new Set());
  const buckets = new Map();
  for (const w of words) {
    for (let i = 0; i < WORD_LEN; i++) {
      const key = i + '|' + w.slice(0, i) + '|' + w.slice(i + 1);
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(w);
    }
  }
  for (const group of buckets.values()) {
    for (let i = 0; i < group.length; i++) {
      for (let j = i + 1; j < group.length; j++) {
        adj.get(group[i]).add(group[j]);
        adj.get(group[j]).add(group[i]);
      }
    }
  }
  return adj;
}

function bfsDist(adj, src, allowedSet) {
  const dist = new Map([[src, 0]]);
  const queue = [src];
  let qi = 0;
  while (qi < queue.length) {
    const u = queue[qi++];
    for (const v of adj.get(u)) {
      if (allowedSet && !allowedSet.has(v)) continue;
      if (!dist.has(v)) { dist.set(v, dist.get(u) + 1); queue.push(v); }
    }
  }
  return dist;
}

function relax(adj, initialMap, nodeList, nodeSet) {
  const dist = new Map(initialMap);
  const visited = new Set();
  const n = nodeList.length;
  for (let iter = 0; iter < n; iter++) {
    let u = null, best = Infinity;
    for (const v of nodeList) {
      if (visited.has(v)) continue;
      const dv = dist.has(v) ? dist.get(v) : Infinity;
      if (dv < best) { best = dv; u = v; }
    }
    if (u === null || best === Infinity) break;
    visited.add(u);
    for (const w of adj.get(u)) {
      if (!nodeSet.has(w)) continue;
      const nd = best + 1;
      if (!dist.has(w) || nd < dist.get(w)) dist.set(w, nd);
    }
  }
  return dist;
}

function steinerPar(adj, terminals, nodeList) {
  const nodeSet = new Set(nodeList);
  const k = terminals.length;
  const distFrom = terminals.map(t => bfsDist(adj, t, nodeSet));
  const size = 1 << k;
  const dp = new Array(size).fill(null);
  for (let i = 0; i < k; i++) dp[1 << i] = new Map(distFrom[i]);
  for (let mask = 1; mask < size; mask++) {
    if ((mask & (mask - 1)) === 0) continue;
    let best = new Map();
    for (let sub = (mask - 1) & mask; sub > 0; sub = (sub - 1) & mask) {
      const other = mask ^ sub;
      if (sub > other) continue;
      const da = dp[sub], db = dp[other];
      for (const v of nodeList) {
        const a = da.has(v) ? da.get(v) : Infinity;
        const b = db.has(v) ? db.get(v) : Infinity;
        if (a < Infinity && b < Infinity) {
          const s = a + b;
          if (!best.has(v) || s < best.get(v)) best.set(v, s);
        }
      }
    }
    dp[mask] = relax(adj, best, nodeList, nodeSet);
  }
  let ans = Infinity;
  for (const d of dp[size - 1].values()) if (d < ans) ans = d;
  return ans;
}

// Same DP as steinerPar, but also reconstructs one actual optimal tree
// (there can be ties; any one of them is a valid "the" answer) by walking
// back through the finished DP table and checking, at each (mask, node),
// which of the two ways a value could have arisen — a branch merging two
// terminal-subsets, or a single graph edge — actually explains it.
function steinerTreeWithEdges(adj, terminals, nodeList) {
  const nodeSet = new Set(nodeList);
  const k = terminals.length;
  const distFrom = terminals.map(t => bfsDist(adj, t, nodeSet));
  const size = 1 << k;
  const dp = new Array(size).fill(null);
  for (let i = 0; i < k; i++) dp[1 << i] = new Map(distFrom[i]);
  for (let mask = 1; mask < size; mask++) {
    if ((mask & (mask - 1)) === 0) continue;
    let best = new Map();
    for (let sub = (mask - 1) & mask; sub > 0; sub = (sub - 1) & mask) {
      const other = mask ^ sub;
      if (sub > other) continue;
      const da = dp[sub], db = dp[other];
      for (const v of nodeList) {
        const a = da.has(v) ? da.get(v) : Infinity;
        const b = db.has(v) ? db.get(v) : Infinity;
        if (a < Infinity && b < Infinity) {
          const s = a + b;
          if (!best.has(v) || s < best.get(v)) best.set(v, s);
        }
      }
    }
    dp[mask] = relax(adj, best, nodeList, nodeSet);
  }
  const full = size - 1;
  let bestV = null, bestVal = Infinity;
  for (const [v, d] of dp[full]) if (d < bestVal) { bestVal = d; bestV = v; }

  const edgeSet = new Set();
  const edgesOut = [];
  function addEdge(a, b) {
    const key = a < b ? a + '|' + b : b + '|' + a;
    if (!edgeSet.has(key)) { edgeSet.add(key); edgesOut.push([a, b]); }
  }
  function reconstruct(mask, v) {
    const val = dp[mask].get(v);
    if (val === 0) return; // v is the terminal for this singleton mask
    if ((mask & (mask - 1)) !== 0) {
      for (let sub = (mask - 1) & mask; sub > 0; sub = (sub - 1) & mask) {
        const other = mask ^ sub;
        if (sub > other) continue;
        const a = dp[sub].has(v) ? dp[sub].get(v) : Infinity;
        const b = dp[other].has(v) ? dp[other].get(v) : Infinity;
        if (a + b === val) { reconstruct(sub, v); reconstruct(other, v); return; }
      }
    }
    for (const u of adj.get(v)) {
      if (!nodeSet.has(u)) continue;
      const du = dp[mask].has(u) ? dp[mask].get(u) : Infinity;
      if (du + 1 === val) { addEdge(v, u); reconstruct(mask, u); return; }
    }
  }
  reconstruct(full, bestV);
  return { value: bestVal, edges: edgesOut };
}

function ballFrom(adj, center, radius) {
  const dist = bfsDist(adj, center, null);
  const out = [];
  for (const [w, d] of dist) if (d <= radius) out.push(w);
  return out;
}

function sampleK(arr, k) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, k);
}

/* =========================================================================
   PUZZLE GENERATION
   Valid puzzle = all targets reachable from each other (guaranteed, since
   we only ever draw from the giant component) AND no two targets already
   one letter apart (that would be a free, trivial connection) AND the
   true minimum extra-words-needed falls in a hand-tuned difficulty band.
   These PAR_RANGE / BALL_RADIUS constants are the main knobs to retune
   after playtesting.
   ========================================================================= */
const PAR_RANGE = { 3: [5, 8], 4: [7, 11] }; // in edges; wordsNeeded = edges - k + 1
const BALL_RADIUS = 4;

function generatePuzzle(adj, words, k) {
  const [lo, hi] = PAR_RANGE[k];
  let fallback = null;
  for (let centerTry = 0; centerTry < 25; centerTry++) {
    const center = words[Math.floor(Math.random() * words.length)];
    const ball = ballFrom(adj, center, BALL_RADIUS);
    if (ball.length < k + 2) continue;
    for (let t = 0; t < 150; t++) {
      const cand = sampleK(ball, k);
      let ok = true;
      for (let i = 0; i < k && ok; i++)
        for (let j = i + 1; j < k; j++)
          if (adj.get(cand[i]).has(cand[j])) { ok = false; break; }
      if (!ok) continue;
      const par = steinerPar(adj, cand, ball);
      if (par >= lo && par <= hi) {
        return { targets: cand, parEdges: par, wordsNeeded: par - k + 1, ball };
      }
      if (!fallback || Math.abs(par - (lo + hi) / 2) < Math.abs(fallback.parEdges - (lo + hi) / 2)) {
        fallback = { targets: cand, parEdges: par, wordsNeeded: par - k + 1, ball };
      }
    }
  }
  return fallback;
}

  const stack = [word];
  seen.add(word);
  while (stack.length) {
    const u = stack.pop();
    for (const v of (playerAdj.get(u) || [])) {
      if (!seen.has(v)) { seen.add(v); stack.push(v); }
    }
  }
  return seen;
}

function targetsLinked(a, b) {
  return clusterColorFor(a).has(b);
}

function allTargetsConnected() {
  const [t0, ...rest] = puzzle.targets;
  const cluster = clusterColorFor(t0);
  return rest.every(t => cluster.has(t));
}

function renderTargetsStrip() {
  const strip = document.getElementById('targets-strip');
  strip.innerHTML = '';
  puzzle.targets.forEach(t => {
    const chip = document.createElement('span');
    chip.className = 'target-chip';
    chip.textContent = t;
    chip.dataset.word = t;
    strip.appendChild(chip);
  });
  updateTargetChipStates();
}

function updateTargetChipStates() {
  document.querySelectorAll('.target-chip').forEach(chip => {
    const w = chip.dataset.word;
    const others = puzzle.targets.filter(t => t !== w);
    const linked = others.some(o => targetsLinked(w, o));
    chip.classList.toggle('linked', linked);
  });
}

function initGraph() {
  svg.selectAll('*').remove();
  const rect = svg.node().getBoundingClientRect();
  const w = rect.width, h = rect.height;

  nodes = puzzle.targets.map((t, i) => {
    const angle = (i / puzzle.targets.length) * Math.PI * 2 - Math.PI / 2;
    const r = Math.min(w, h) * 0.22;
    return { id: t, isTarget: true, x: w / 2 + r * Math.cos(angle), y: h / 2 + r * Math.sin(angle) };
  });
  links = [];
  playerAdj = new Map();
  puzzle.targets.forEach(t => playerAdj.set(t, new Set()));

  simulation = d3.forceSimulation(nodes)
    .force('charge', d3.forceManyBody().strength(-260))
    .force('link', d3.forceLink(links).id(d => d.id).distance(90).strength(0.9))
    .force('center', d3.forceCenter(w / 2, h / 2))
    .force('collide', d3.forceCollide(34))
    .force('x', d3.forceX(w / 2).strength(0.03))
    .force('y', d3.forceY(h / 2).strength(0.03))
    .alphaTarget(0.025)
    .on('tick', ticked);

  // gentle continuous drift so the web never fully sits still
  simulation.force('jitter', () => {
    for (const n of nodes) {
      n.vx += (Math.random() - 0.5) * 0.9;
      n.vy += (Math.random() - 0.5) * 0.9;
    }
  });

  linkSel = svg.append('g').attr('class', 'links').selectAll('line');
  nodeSel = svg.append('g').attr('class', 'nodes').selectAll('circle');
  labelSel = svg.append('g').attr('class', 'labels').selectAll('text');

  redraw();
}

function nodeRadius(d) { return d.isTarget ? 30 : 26; }
function nodeFill(d) { return d.isTarget ? 'var(--target)' : (d.isSolution ? 'var(--solution)' : 'var(--added)'); }
function nodeGlow(d) { return d.isTarget ? 'var(--target-glow)' : (d.isSolution ? 'var(--solution-glow)' : 'var(--added-glow)'); }

function redraw() {
  linkSel = linkSel.data(links, d => (d.source.id || d.source) + '-' + (d.target.id || d.target));
  linkSel.exit().remove();
  linkSel = linkSel.enter().append('line')
    .attr('stroke', d => d.isSolution ? 'var(--solution)' : 'var(--line-active)')
    .attr('stroke-dasharray', d => d.isSolution ? '4 4' : null)
    .attr('stroke-width', 1.6)
    .attr('opacity', 0)
    .call(sel => sel.transition().duration(300).attr('opacity', d => d.isSolution ? 0.85 : 1))
    .merge(linkSel);

  nodeSel = nodeSel.data(nodes, d => d.id);
  nodeSel.exit().remove();
  const nodeEnter = nodeSel.enter().append('circle')
    .attr('r', 0)
    .attr('fill', nodeFill)
    .style('filter', d => `drop-shadow(0 0 10px ${nodeGlow(d)})`)
    .attr('stroke', d => d.isTarget ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.25)')
    .attr('stroke-width', d => d.isTarget ? 2 : 1.2)
    .attr('opacity', d => d.isSolution ? 0.9 : 1)
    .call(drag(simulation));
  nodeEnter.transition().duration(320).attr('r', nodeRadius);
  nodeSel = nodeEnter.merge(nodeSel);

  labelSel = labelSel.data(nodes, d => d.id);
  labelSel.exit().remove();
  labelSel = labelSel.enter().append('text')
    .attr('class', 'node-label')
    .attr('opacity', 0)
    .text(d => d.id)
    .call(sel => sel.transition().duration(320).attr('opacity', 1))
    .merge(labelSel);

  simulation.nodes(nodes);
  simulation.force('link').links(links);
  simulation.alpha(Math.max(simulation.alpha(), 0.5)).restart();
}

function ticked() {
  const rect = svg.node().getBoundingClientRect();
  const pad = 40;
  for (const n of nodes) {
    n.x = Math.max(pad, Math.min(rect.width - pad, n.x));
    n.y = Math.max(pad, Math.min(rect.height - pad, n.y));
  }
  linkSel
    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
  nodeSel.attr('cx', d => d.x).attr('cy', d => d.y);
  labelSel.attr('x', d => d.x).attr('y', d => d.y);
}

function drag(sim) {
  function started(event, d) {
    if (!event.active) sim.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
  function ended(event, d) {
    if (!event.active) sim.alphaTarget(0.025);
    d.fx = null; d.fy = null;
  }
  return d3.drag().on('start', started).on('drag', dragged).on('end', ended);
}

/* =========================================================================
   PLAYER INPUT
   ========================================================================= */
const input = document.getElementById('word-input');
const submitBtn = document.getElementById('submit-btn');
const revealBtn = document.getElementById('reveal-btn');
const statusMsg = document.getElementById('status-msg');
const counter = document.getElementById('counter');

function setStatus(msg, kind) {
  statusMsg.textContent = msg || '';
  statusMsg.className = kind || '';
}

function tryAddWord() {
  if (won || revealed) return;
  const raw = input.value.trim().toLowerCase();
  if (raw.length !== WORD_LEN) {
    flagError(`Words are ${WORD_LEN} letters.`); return;
  }
  if (!WORD_SET.has(raw)) {
    flagError('Not in the word list.'); return;
  }
  if (nodes.some(n => n.id === raw)) {
    flagError('Already in your web.'); return;
  }
  const attachTo = nodes.filter(n => GLOBAL_ADJ.get(raw).has(n.id));
  if (attachTo.length === 0) {
    flagError("Doesn't differ by exactly one letter from anything in your web yet.");
    return;
  }
  // valid move
  nodes.push({ id: raw, isTarget: false });
  attachTo.forEach(n => {
    links.push({ source: raw, target: n.id });
    if (!playerAdj.has(raw)) playerAdj.set(raw, new Set());
    playerAdj.get(raw).add(n.id);
    playerAdj.get(n.id).add(raw);
  });
  wordsAdded++;
  counter.textContent = `${wordsAdded} word${wordsAdded === 1 ? '' : 's'} added`;
  setStatus(attachTo.length > 1 ? `Connected to ${attachTo.length} words at once!` : '', 'win');
  input.value = '';
  redraw();
  updateTargetChipStates();
  if (allTargetsConnected()) {
    setTimeout(showWin, 380);
  }
}

function flagError(msg) {
  setStatus(msg, 'error');
  input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
}

submitBtn.addEventListener('click', tryAddWord);
input.addEventListener('keydown', e => { if (e.key === 'Enter') tryAddWord(); });
input.addEventListener('input', () => { setStatus(''); });

/* =========================================================================
   WIN STATE
   ========================================================================= */
function showWin() {
  won = true;
  input.disabled = true; submitBtn.disabled = true; revealBtn.disabled = true;
  const diff = wordsAdded - puzzle.wordsNeeded;
  const scoreEl = document.getElementById('win-score');
  const detailEl = document.getElementById('win-detail');
  scoreEl.textContent = diff <= 0 ? 'E' : `+${diff}`;
  detailEl.innerHTML = `You used <b>${wordsAdded}</b> word${wordsAdded === 1 ? '' : 's'}. ` +
    `Par for this web was <b>${puzzle.wordsNeeded}</b>.`;
  document.getElementById('win-overlay').classList.add('show');
}

document.getElementById('play-again-btn').addEventListener('click', () => newPuzzle(currentK));

/* =========================================================================
   REVEAL ANSWER
   Draws in whichever of the precomputed optimal-tree edges the player
   hasn't already found, styled distinctly (dashed, muted gold) so it's
   clear which nodes/edges were the player's own work vs. the reveal.
   ========================================================================= */
function revealAnswer() {
  if (won || revealed || !puzzle || !puzzle.solution) return;
  revealed = true;
  input.disabled = true; submitBtn.disabled = true; revealBtn.disabled = true;

  const existingIds = new Set(nodes.map(n => n.id));
  const existingLinkKeys = new Set(links.map(l => {
    const s = l.source.id || l.source, t = l.target.id || l.target;
    return s < t ? s + '|' + t : t + '|' + s;
  }));

  puzzle.solution.forEach(([a, b]) => {
    if (!existingIds.has(a)) {
      nodes.push({ id: a, isTarget: puzzle.targets.includes(a), isSolution: true });
      existingIds.add(a);
    }
    if (!existingIds.has(b)) {
      nodes.push({ id: b, isTarget: puzzle.targets.includes(b), isSolution: true });
      existingIds.add(b);
    }
    const key = a < b ? a + '|' + b : b + '|' + a;
    if (!existingLinkKeys.has(key)) {
      links.push({ source: a, target: b, isSolution: true });
      existingLinkKeys.add(key);
    }
  });

  redraw();
  setStatus(`Optimal solution shown — par was ${puzzle.wordsNeeded} word${puzzle.wordsNeeded === 1 ? '' : 's'}.`, 'win');
}

revealBtn.addEventListener('click', revealAnswer);

/* =========================================================================
   PUZZLE LIFECYCLE
   ========================================================================= */
function newPuzzle(k) {
  currentK = k;
  won = false;
  revealed = false;
  wordsAdded = 0;
  counter.textContent = '0 words added';
  setStatus('');
  input.disabled = false; submitBtn.disabled = false; revealBtn.disabled = false; input.value = '';
  document.getElementById('win-overlay').classList.remove('show');
  document.getElementById('loading').style.display = 'flex';
  document.querySelectorAll('#k-toggle button').forEach(b => b.classList.toggle('active', Number(b.dataset.k) === k));

  setTimeout(() => {
    puzzle = generatePuzzle(GLOBAL_ADJ, WORDS, k);
    puzzle.solution = steinerTreeWithEdges(GLOBAL_ADJ, puzzle.targets, puzzle.ball).edges;
    renderTargetsStrip();
    initGraph();
    document.getElementById('loading').style.display = 'none';
    input.focus();
  }, 30);
}

document.getElementById('new-puzzle-btn').addEventListener('click', () => newPuzzle(currentK));
document.querySelectorAll('#k-toggle button').forEach(btn => {
  btn.addEventListener('click', () => newPuzzle(Number(btn.dataset.k)));
});
window.addEventListener('resize', () => { if (puzzle) initGraph(); });

newPuzzle(3);
</script>
