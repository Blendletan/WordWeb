<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Web has moved | RMLP</title>
  <meta name="description" content="Word Web has moved to Random Mind-bending Little Puzzles.">
  <link rel="canonical" href="https://randomlittlepuzzles.com/word-web/">
  <!-- JavaScript-disabled fallback (cannot preserve query parameters). -->
  <meta http-equiv="refresh" content="2;url=https://randomlittlepuzzles.com/word-web/">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6efdd;
      color: #2a2018;
      font: 1rem/1.5 system-ui, sans-serif;
      text-align: center;
    }
    main { padding: 2rem; }
    a { color: #1f5c55; }
  </style>
</head>
<body>
  <main>
    <h1>Word Web has moved</h1>
    <p>Redirecting you to our new website&hellip;</p>
    <p><a id="continue" href="https://randomlittlepuzzles.com/word-web/">Continue to Word Web</a></p>
  </main>
  <script>
    (() => {
      'use strict';

      const destination = new URL('https://randomlittlepuzzles.com/word-web/');
      destination.search = location.search;
      destination.hash = location.hash;
      document.getElementById('continue').href = destination.href;

      const redirect = () => location.replace(destination.href);

      // Preserve the existing GoatCounter account and original page path.
      // The q parameter supplies campaign information, including UTM tags.
      // This is the documented GoatCounter /count tracking endpoint.
      const data = new URLSearchParams({
        p: location.pathname,
        t: document.title,
        q: location.search,
        s: String(screen.width),
        rnd: Math.random().toString(36).slice(2)
      });
      if (document.referrer) data.set('r', document.referrer);

      const trackingUrl = 'https://blendletan.goatcounter.com/count?' + data.toString();

      // Match GoatCounter's built-in preference to skip tracking.
      try {
        if (localStorage.getItem('skipgc') === 't') {
          redirect();
          return;
        }
      } catch (_) { /* Storage can be unavailable; don't block navigation. */ }

      // GoatCounter uses sendBeacon itself; it survives page navigation.
      // If unsupported or not queued, try its documented image fallback.
      try {
        if (navigator.sendBeacon && navigator.sendBeacon(trackingUrl)) {
          redirect();
          return;
        }
      } catch (_) { /* Try the image fallback. */ }

      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        redirect();
      };
      const pixel = new Image();
      pixel.onload = finish;
      pixel.onerror = finish;
      setTimeout(finish, 800);
      pixel.src = trackingUrl;
    })();
  </script>
</body>
</html>
